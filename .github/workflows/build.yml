name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: '*.dmg'
          - os: ubuntu-22.04
            artifact: '*.AppImage'
          - os: windows-latest
            artifact: '*.msi'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "$V"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: npm run test:backend

      # Split per tool: a failure names the thing that broke instead of a bare
      # "step failed" with three candidates.
      - name: Check the release manifest generator
        shell: bash
        run: node scripts/release-manifest.mjs --selftest

      # The plugin templates and the authoring skill are generated from the
      # platform's own sources. A schema change that forgets either one would
      # ship an agent knowledge that no longer matches the app, so both are
      # re-generated here and compared.
      - name: Check the plugin templates
        shell: bash
        run: npm run plugin:check

      - name: Check the plugin authoring skill
        shell: bash
        run: npm run plugin:skill:check

      # Plugin `network` origins are baked into the Tauri CSP at build time.
      # A manifest change that forgets the policy would install fine and fail
      # at runtime on the user's machine, so drift fails here instead.
      - name: Check the plugin CSP covers declared origins
        shell: bash
        run: node scripts/gen-plugin-csp.mjs --check

      # Tauri's nonce injection makes 'unsafe-inline' inert, which silently
      # strips every runtime-injected style (xterm's per-terminal sheets, the
      # palette swatches' style="" attributes) in packaged builds only. The
      # failure is invisible without a pane open, so it is checked here.
      - name: Check the CSP keeps inline styles alive
        shell: bash
        run: npm run check:csp-inline-styles

      - name: Check the POSIX installer
        if: runner.os == 'Linux'
        shell: bash
        run: sh scripts/verify-installer.sh

      - name: Check the PowerShell installer
        shell: bash
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File scripts/verify-installer.ps1
          else
            echo "pwsh unavailable; skipping the PowerShell installer check"
          fi

      - name: Prepare cloudflared binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            CLOUDFLARED_ALL_MACOS_ARCHS=1 node scripts/prepare-cloudflared.mjs
          else
            node scripts/prepare-cloudflared.mjs
          fi

      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # must be present (set, even if empty) whenever the key is: the tauri
          # cli prompts for a missing password and dies with a misleading
          # "incorrect updater private key password" on a runner without a tty.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLOUDFLARED_ALL_MACOS_ARCHS: ${{ runner.os == 'macOS' && '1' || '' }}
        run: |
          # Validate signing key before use — non-empty but malformed base64 causes a
          # deep Tauri failure; catch it early so the error is obvious.
          SIGNING_KEY_VALID=0
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set - building without updater artifacts, so this release publishes no updater.json and installed apps cannot auto-update."
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]' | grep -qE '^[A-Za-z0-9+/]+=*$'; then
              SIGNING_KEY_VALID=1
            else
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY is set but not valid base64 - skipping updater artifacts. Fix the secret to enable auto-updates."
            fi
          fi

          # Inject createUpdaterArtifacts only when the signing key is present AND valid
          UPDATER_CFG='{}'
          if [ "$SIGNING_KEY_VALID" = "1" ]; then
            UPDATER_CFG='{"bundle":{"createUpdaterArtifacts":true}}'
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run tauri -- build --target universal-apple-darwin --config "$UPDATER_CFG"
            echo "BUNDLE_DIR=src-tauri/target/universal-apple-darwin/release/bundle" >> "$GITHUB_ENV"
          else
            npm run tauri -- build --config "$UPDATER_CFG"
            echo "BUNDLE_DIR=src-tauri/target/release/bundle" >> "$GITHUB_ENV"
          fi

      - name: Validate packaged resources and sizes
        run: node scripts/verify-bundle.mjs "$BUNDLE_DIR"

      # One filename per runner: the manifest job downloads every checksum
      # artifact into a single directory (merge-multiple), where three files all
      # called checksums.sha256 would overwrite each other and leave only the
      # last runner's hashes behind.
      - name: Generate checksums
        shell: bash
        run: |
          mkdir -p dist
          if command -v sha256sum >/dev/null 2>&1; then HASHER=sha256sum; else HASHER="shasum -a 256"; fi
          find "$BUNDLE_DIR" -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' -o -name '*-setup.exe' \) -print0 \
            | sort -z | xargs -0 $HASHER > "dist/checksums-${RUNNER_OS}.sha256"
          cat "dist/checksums-${RUNNER_OS}.sha256"

      - name: Generate updater fragment
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::no signing key; skipping the updater fragment - no updater.json will be published"
            exit 0
          fi
          node scripts/release-manifest.mjs \
            --updater-fragment \
            --bundle "$BUNDLE_DIR" \
            --tag "$GITHUB_REF_NAME" \
            --out "dist/updater-${RUNNER_OS}.json"

      # The artifact service fails with transient DNS errors (ENOTFOUND) that
      # upload-artifact does not retry on its own, so each upload gets one
      # guarded second attempt. Only the first attempt is allowed to fail
      # silently; a failure on the retry fails the job.
      - name: Upload packaged artifact
        id: upload_package
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bentomux-${{ runner.os }}
          path: |
            ${{ env.BUNDLE_DIR }}/**/*.dmg
            ${{ env.BUNDLE_DIR }}/**/*.AppImage
            ${{ env.BUNDLE_DIR }}/**/*.deb
            ${{ env.BUNDLE_DIR }}/**/*.msi
            ${{ env.BUNDLE_DIR }}/**/*-setup.exe
          if-no-files-found: error

      - name: Upload packaged artifact (retry)
        if: steps.upload_package.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: bentomux-${{ runner.os }}
          path: |
            ${{ env.BUNDLE_DIR }}/**/*.dmg
            ${{ env.BUNDLE_DIR }}/**/*.AppImage
            ${{ env.BUNDLE_DIR }}/**/*.deb
            ${{ env.BUNDLE_DIR }}/**/*.msi
            ${{ env.BUNDLE_DIR }}/**/*-setup.exe
          if-no-files-found: error
          # a half-created artifact from the failed attempt would otherwise
          # collide on the same name
          overwrite: true

      - name: Upload checksum list
        id: upload_checksums
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: bentomux-checksums-${{ runner.os }}
          path: dist/checksums-*.sha256
          if-no-files-found: error

      - name: Upload checksum list (retry)
        if: steps.upload_checksums.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: bentomux-checksums-${{ runner.os }}
          path: dist/checksums-*.sha256
          if-no-files-found: error
          overwrite: true

      - name: Upload updater fragment
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: bentomux-updater-${{ runner.os }}
          path: dist/updater-*.json
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the annotated tag message is the release body: --generate-notes
          # would throw it away and publish a bare changelog link.
          # `%(contents:body)` and not `%(contents)`: a signed tag carries its
          # PGP block inside the tag object, and `%(contents)` includes it, so
          # the published notes would end with a wall of base64.
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          find "$BUNDLE_DIR" -type f \( \
            -name '*.dmg' \
            -o -name '*.AppImage' \
            -o -name '*.deb' \
            -o -name '*.rpm' \
            -o -name '*.msi' \
            -o -name '*-setup.exe' \
            -o -name '*.app.tar.gz' \
          \) -exec gh release upload "$GITHUB_REF_NAME" {} --clobber \;

  manifest:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: bentomux-checksums-*
          merge-multiple: true
          path: dist/checksums

      - uses: actions/download-artifact@v7
        with:
          pattern: bentomux-updater-*
          merge-multiple: true
          path: dist/updater-fragments
        continue-on-error: true  # fragments absent when signing key not set

      - name: Build latest.json and the Homebrew cask
        run: |
          ls -l dist/checksums
          node scripts/release-manifest.mjs --selftest
          mkdir -p dist/out
          node scripts/release-manifest.mjs --tag "$GITHUB_REF_NAME" \
            --checksums dist/checksums --out dist/out/latest.json --cask dist/out/bentomux.rb
          cat dist/checksums/*.sha256 | sort -k2 > dist/out/sha256sums.txt
          cat dist/out/latest.json

      - name: Build updater.json
        run: |
          if [ -d dist/updater-fragments ] && ls dist/updater-fragments/*.json >/dev/null 2>&1; then
            node scripts/release-manifest.mjs \
              --updater-manifest \
              --updater-fragments dist/updater-fragments \
              --tag "$GITHUB_REF_NAME" \
              --out dist/out/updater.json
            echo "updater.json built"
          else
            echo "No updater fragments found (signing key not configured); skipping updater.json"
          fi

      - name: Publish the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA=""
          if [ -f dist/out/updater.json ]; then EXTRA="dist/out/updater.json"; fi
          for attempt in 1 2 3 4 5; do
            gh release upload "$GITHUB_REF_NAME" dist/out/latest.json dist/out/sha256sums.txt $EXTRA --clobber && exit 0
            echo "upload attempt $attempt failed; retrying"
            sleep 10
          done
          echo "::error::could not publish latest.json to $GITHUB_REF_NAME"
          exit 1

      - name: Bump the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap bump"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/takora-dev/homebrew-tap.git" tap || {
            echo "::warning::cannot reach takora-dev/homebrew-tap; skipping the bump"
            exit 0
          }
          mkdir -p tap/Casks
          cp dist/out/bentomux.rb tap/Casks/bentomux.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/bentomux.rb
          if git diff --cached --quiet; then
            echo "the cask is already up to date"
            exit 0
          fi
          git commit -m "bentomux ${GITHUB_REF_NAME#v}"
          git push
