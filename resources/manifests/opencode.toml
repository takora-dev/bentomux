id = "opencode"
version = "2026.10.15.1"
min_engine_version = 1
updated_at = "2026-10-15T00:00:00Z"
aliases = ["open-code", "herdr:opencode"]

# Both working signals are live footers (interrupt hint / progress bar).
# They must only match the bottom lines: transcript history keeps a stale
# "esc to interrupt" line visible after the turn ends, and a whole_recent
# rule pins the tab on working forever — including (and especially) when
# the pane sits unfocused behind a newly opened terminal while it finishes.
# Same bug class as pi's spinner rule (see pi.toml).

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(8)"
visible_working = true
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["press esc to interrupt"] },
  { line_regex = ['(?i).*opencode.*esc (again to )?interrupt'] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(8)"
visible_working = true
regex = ['(■|⬝){4,}']
