<style>
  :root{--bg:#f6f5f2;--card:#ffffff;--line:#e4e2dd;--ink:#1f2328;--mut:#6f7680;
    --acc:#2563eb;--acc-h:#1d4ed8;--ok:#16a34a;--bad:#dc2626;--sumbg:rgba(0,0,0,.05)}
  @media(prefers-color-scheme:dark){:root{--bg:#141416;--card:#1c1c20;--line:#2c2c31;
    --ink:#ececf0;--mut:#9aa0a8;--acc:#3b82f6;--acc-h:#60a5fa;--ok:#4ade80;--bad:#f87171;--sumbg:rgba(255,255,255,.07)}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,'Segoe UI',system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
    padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:600;flex:1}
  .logo{width:22px;height:22px;border-radius:6px;flex:0 0 auto}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:0 0 auto}
  .dot.on,.dot.working{background:var(--ok)}
  .dot.blocked{background:var(--bad)}
  .cstate{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
  .badge{font-size:12px;line-height:1;background:var(--bad);color:#fff;
    border-radius:99px;padding:4px 8px;display:none}
  #approvals{padding:10px 12px 0;display:none}
  .approval{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:10px}
  .ahead{display:flex;align-items:baseline;gap:8px}
  .ahead strong{font-size:15px}
  .asub{color:var(--mut);font-size:12px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .asum{font:12px/1.55 ui-monospace,Consolas,monospace;background:var(--sumbg);
    border-radius:8px;padding:8px 10px;margin:8px 0 0;white-space:pre-wrap;
    word-break:break-word;max-height:120px;overflow:auto}
  .arow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  button{border:0;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;
    background:transparent;color:var(--ink)}
  .approve{background:var(--acc);color:#fff;min-width:96px}
  .approve:active{background:var(--acc-h)}
  .deny{border:1px solid var(--line)}
  #list{padding:10px 12px 24px}
  .empty{color:var(--mut);text-align:center;padding:48px 0}
  .session{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;margin-bottom:8px;font:inherit;color:inherit}
  .session:active{border-color:var(--mut)}
  .scol{display:flex;flex-direction:column;gap:2px;min-width:0}
  .stitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ssub{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #viewer{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column}
  #viewer[hidden]{display:none}
  .vhead{display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-bottom:1px solid var(--line);background:var(--bg)}
  .vhead button{font-size:20px;line-height:1;padding:4px 10px}
  #vtitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  /* the pane behind this is the desktop's own terminal, untouched: the phone
     scrolls sideways over a 200-column screen rather than reshaping it.
     overflow-anchor:none because we place the scroll ourselves — any engine
     that also anchors would adjust it a second time. */
  /* the grid holds one slot per pane the phone mirrors. Stacked in portrait,
     side by side in landscape: side by side on a 390px phone leaves 195px of
     terminal, which is not a thing anyone reads. */
  #panes{flex:1;min-height:0;display:flex;flex-direction:column}
  #panes .pslot{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;
    border-top:1px solid var(--line);outline:1px solid transparent;outline-offset:-1px}
  #panes .pslot:first-child{border-top:0}
  /* the slot the typebar types into; one input means one target */
  #panes .pslot.on{outline-color:#4c8dff}
  #panes .ptitle{flex:0 0 auto;padding:5px 10px;font-size:11px;color:var(--dim);
    background:var(--card);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #panes .pslot.on .ptitle{color:var(--fg)}
  @media (orientation:landscape){
    #panes{flex-direction:row}
    #panes .pslot{border-top:0;border-left:1px solid var(--line)}
    #panes .pslot:first-child{border-left:0}
  }
  .plog{flex:1;margin:0;padding:8px 10px;overflow:auto;min-width:0;min-height:0;
    white-space:pre;overflow-anchor:none;overflow-wrap:normal;word-break:normal;
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:#101214;color:#e6e6e6;-webkit-text-size-adjust:100%}
  #typebar{border-top:1px solid var(--line);background:var(--card);padding:8px 10px 10px;
    display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
  .trow{display:flex;gap:8px;align-items:center}
  .trow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;
    background:var(--bg);color:var(--ink);padding:10px 12px;font:16px/1.2 -apple-system,system-ui,sans-serif}
  .trow input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
  .tsend{background:var(--acc);color:#fff;min-width:72px;font-weight:600}
  .tsend:active{background:var(--acc-h)}
  .tkeys{display:flex;gap:6px;flex-wrap:wrap}
  .tkeys button{border:1px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:8px;padding:7px 10px;font:12px/1 ui-monospace,Consolas,monospace;min-width:0}
  .tkeys button:active{background:var(--sumbg)}
  .thint{color:var(--mut);font-size:11px;line-height:1.3}
</style>
</head>

  <h1>Bentomux</h1>
  <span class="badge" id="badge"></span>
</header>
<div id="approvals"></div>
<main id="list"></main>
<section id="viewer" hidden>
  <div class="vhead">
    <button id="back" aria-label="Back">&larr;</button>
    <span id="vtitle"></span>
  </div>
  <div id="panes"></div>
  <div id="typebar">
    <div class="trow">
      <input id="tinput" placeholder="Type into this pane…" autocomplete="off" spellcheck="false" autocapitalize="off" />
      <button id="tsend" class="tsend" type="button">Send</button>
    </div>
    <div class="tkeys">
      <button type="button" data-seq="&quot;\u001b&quot;">Esc</button>
      <button type="button" data-seq="&quot;\u0003&quot;">Ctrl+C</button>
      <button type="button" data-seq="&quot;\r&quot;">Enter</button>
      <button type="button" data-seq="&quot;\t&quot;">Tab</button>
      <button type="button" data-seq="&quot;\u001b[D&quot;">&#8592;</button>
      <button type="button" data-seq="&quot;\u001b[C&quot;">&#8594;</button>
      <button type="button" data-seq="&quot;\u001b[A&quot;">&#8593;</button>
      <button type="button" data-seq="&quot;\u001b[B&quot;">&#8595;</button>
    </div>
    <div class="thint" id="thint">This session grants full terminal control — including typing — until the pairing cookie expires or you turn Remote off.</div>
  </div>
</section>
<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };

var ws = null, retry = 0, connected = false, timer = null;
var panes = [];
var pending = new Map();   /* requestId -> approval request */
/* the panes the phone mirrors, newest last: one slot each with its own
   frame, scroll position and last-rendered signature */
var open = [];
var focus = null;          /* the one pane the typebar types into */
/* one font size per screen. The pane keeps the desktop's own grid; the phone
   reads it as sent and scrolls sideways. */
var FONT = window.innerWidth >= 560 ? 12.5 : 11;
var HINT = hintEl() ? hintEl().textContent : '';

function el(tag, attrs) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    var v = attrs[k];
    if (v == null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (var i = 2; i < arguments.length; i++) {
    var kid = arguments[i];
    if (kid != null) n.append(kid);
  }
  return n;
}

function hintEl() { return $('thint'); }

function setHint(text) { var el = hintEl(); if (el) { el.textContent = text; } }

function setConn(on, label) {
  connected = on;
  $('conn').classList.toggle('on', on);
  $('cstate').textContent = label || (on ? 'live' : 'reconnecting…');
  if (on) setHint(HINT);
}

function send(o) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
}

function connect() {
  /* never stack sockets: a second one would keep its own watch alive on the
     desktop and both would fight over the same messages */
  if (ws && ws.readyState <= 1) return;
  if (timer) { clearTimeout(timer); timer = null; }
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  /* the pairing token was already traded for an HttpOnly session cookie on
     the redirect that brought us here; the socket presents that cookie */
  ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onopen = function () {
    retry = 0;
    setConn(true, 'live');
    /* the panes were open before the socket dropped: ask for fresh frames */
    if (open.length) sendWatch();
  };
  ws.onclose = function () {
    var tries = ++retry;
    setConn(false, tries >= 6 ? 'offline — retrying' : 'reconnecting…');
    timer = setTimeout(connect, Math.min(4000, 400 * tries));
  };
  ws.onerror = function () { ws.close(); };
  ws.onmessage = function (e) {
    var m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m && m.t) handle(m);
  };
}

document.addEventListener('visibilitychange', function () {
  /* mobile browsers suspend sockets in background: reconnect eagerly */
  if (!document.hidden && (!ws || ws.readyState > 1)) { retry = 0; connect(); }
});

function handle(m) {
  if (m.t === 'panes') {
    panes = m.panes || [];
    renderList();
  } else if (m.t === 'status') {
    var st = m.statuses || {};
    for (var i = 0; i < panes.length; i++) {
      var s = st[panes[i].id];
      if (s) { panes[i].state = s.state != null ? s.state : null; panes[i].runtime = s.runtime != null ? s.runtime : null; }
    }
    renderList();
  } else if (m.t === 'gone') {
    dropPane(m.paneId);
  } else if (m.t === 'view') {
    var s = slot(m.paneId);
    if (s) {
      /* an agent idling (or just a redrawn cursor) repeats the same screen
         four times a second; rebuilding the DOM for that is the other half
         of the lag */
      var sig = m.html || m.text || '';
      if (sig === s.sig) return;
      s.sig = sig;
      renderFrame(s, m.html, m.text);
    }
  } else if (m.t === 'approval') {
    pending.set(m.req.requestId, m.req);
    renderApprovals();
  } else if (m.t === 'approvalClosed') {
    pending.delete(m.requestId);
    renderApprovals();
  }
}

/* newlines are significant: split text nodes on \n into <br> rows */
function breaks(node) {
  for (var n = node.firstChild; n;) {
    var next = n.nextSibling;
    if (n.nodeType === 3 && n.nodeValue.indexOf('\n') >= 0) {
      var parts = n.nodeValue.split('\n');
      for (var i = 0; i < parts.length; i++) {
        if (i) node.insertBefore(document.createElement('br'), n);
        if (parts[i]) node.insertBefore(document.createTextNode(parts[i]), n);
      }
      node.removeChild(n);
    } else if (n.nodeType === 1) { breaks(n); }
    n = next;
  }
}

function renderFrame(s, html, text) {
  var log = s.log;
  var clean;
  if (html) {
    /* backend sends sanitized <span style>-only html mirroring terminal
       colors; only our own spans exist (cell text is escaped server-side).
       strip anything else defensively, then fall back to plain text. */
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    clean = document.createDocumentFragment();
    (function walk(src, dst) {
      for (var n = src.firstChild; n; n = n.nextSibling) {
        if (n.nodeType === 3) { dst.append(document.createTextNode(n.nodeValue)); }
        else if (n.nodeName === 'SPAN') {
          var s = document.createElement('span');
          var st = n.getAttribute('style') || '';
          /* allow only color/background/weight/style/decoration props */
          if (/^[a-z\-;:#(),\s\d.%]+$/i.test(st)
            && !/url|expression|behavior|binding|javascript/i.test(st)) s.setAttribute('style', st);
          walk(n, s);
          dst.append(s);
        } else if (n.nodeName === 'BR') { dst.append(document.createElement('br')); }
      }
    })(tmp, clean);
  } else {
    clean = document.createDocumentFragment();
    clean.append(document.createTextNode(text || ''));
  }
  breaks(clean);
  var wasPinned = s.pinned;
  log.style.fontSize = FONT + 'px';
  /* rows go in exactly as the desktop laid them out: `white-space:pre` plus
     `overflow-x:auto` scrolls a long line to the right instead of folding
     it into something the agent never printed. One replacement, not a clear
     followed by an append: WebKit can commit the two separately and paint a
     screen that is neither the old one nor the new one. */
  log.replaceChildren(clean);
  if (!wasPinned) return;
  /* Safari paints a DOM change and a scrollTop change in two separate passes
     when a script does both in one task (WebKit #261692): the new offset
     lands against the old content, so a block of the new screen showed up
     cut off. Chrome and the other engines do both in one pass. The next
     animation frame runs after this layout and before the paint, which puts
     the scroll where Safari expects it — no latency, no dropped frames. */
  requestAnimationFrame(function () { log.scrollTop = log.scrollHeight; });
}

/* the watch asks for the pane, not for a size: the pty behind it stays at the
   desktop's own width, and the phone scrolls sideways over it */
function sendWatch() {
  for (var i = 0; i < open.length; i++) {
    send({ t: 'watch', paneId: open[i].id });
  }
}

window.addEventListener('resize', function () {
  /* only the font size is ours to change; the grid stays the desktop's */
  FONT = window.innerWidth >= 560 ? 12.5 : 11;
  if (!open.length) return;
  for (var i = 0; i < open.length; i++) open[i].sig = null;
  sendWatch();
});

function renderList() {
  var host = $('list');
  host.textContent = '';
  if (!panes.length) {
    host.append(el('div', { class: 'empty', text: 'No open terminals on the desktop.' }));
    return;
  }
  for (var i = 0; i < panes.length; i++) {
    var p = panes[i];
    var sub = p.runtime
      ? p.runtime + (p.state ? ' · ' + p.state : '')
      : (p.workspace || '');
    host.append(el('button', { class: 'session', onclick: openPane.bind(null, p.id) },
      el('span', { class: 'dot ' + (p.state || '') }),
      el('span', { class: 'scol' },
        el('span', { class: 'stitle', text: p.title }),
        el('span', { class: 'ssub', text: sub }))));
  }
}

function renderApprovals() {
  var host = $('approvals');
  host.textContent = '';
  host.style.display = pending.size ? 'block' : 'none';
  var badge = $('badge');
  badge.style.display = pending.size ? 'block' : 'none';
  badge.textContent = String(pending.size) + ' blocked';
  pending.forEach(function (req) {
    var pane = panes.find(function (p) { return p.id === req.paneId; });
    var where = pane ? pane.title : (req.cwd ? req.cwd.split(/[\\\\/]/).pop() : 'external session');
    host.append(el('div', { class: 'approval' },
      el('div', { class: 'ahead' },
        el('strong', { text: req.agent || 'agent' }),
        el('span', { class: 'asub', text: where + ' · ' + req.toolName })),
      el('pre', { class: 'asum', text: req.summary || '' }),
      el('div', { class: 'arow' },
        el('button', { class: 'deny', text: 'Deny', onclick: decide.bind(null, req.requestId, 'deny') }),
        el('button', { class: 'approve', text: 'Approve', onclick: decide.bind(null, req.requestId, 'allow') }))));
  });
}

function decide(requestId, decision) {
  send({ t: 'approve', requestId: requestId, decision: decision });
}

function sendInput(data) {
  if (!focus || data == null || data === '') return;
  /* a dead socket swallows the keystroke silently — say so instead */
  if (!connected) { setHint('Offline — keystrokes are dropped until the socket is back.'); return; }
  send({ t: 'write', paneId: focus, data: data });
}

function slot(id) {
  for (var i = 0; i < open.length; i++) if (open[i].id === id) return open[i];
  return null;
}

function paneTitle(id) {
  var p = panes.find(function (x) { return x.id === id; });
  return p ? p.title : id;
}

/* one input, so the pane it lands in has to be the visible one: a tap is
   how you pick, and the outline is the only thing that says where it goes */
function setFocus(id) {
  focus = id;
  for (var i = 0; i < open.length; i++) {
    if (open[i].box.classList) open[i].box.classList.toggle('on', open[i].id === id);
  }
  $('vtitle').textContent = paneTitle(id);
}

/* ponytail: two panes is as many as a phone reads; a third is noise. Raise
   MAX_PANES if a tablet-sized second screen ever needs it. */
var MAX_PANES = 2;

function openPane(id) {
  /* mirror only panes in the selected tab's split tree */
  var selected = panes.find(function (pane) { return pane.id === id; });
  var ids = [id];
  for (var i = 0; selected && i < panes.length && ids.length < MAX_PANES; i++) {
    if (panes[i].tabId === selected.tabId && panes[i].id !== id) ids.push(panes[i].id);
  }
  closeViewer();
  var host = $('panes');
  $('viewer').hidden = false;
  focus = null;
  for (var j = 0; j < ids.length; j++) {
    var log = el('pre', { class: 'plog', text: 'Loading…' });
    /* varargs, not an array: el() appends arguments[2..], so handing it a
       single array would stringify the two children into the slot */
    var box = el('div', { class: 'pslot' },
      el('div', { class: 'ptitle', text: paneTitle(ids[j]) }),
      log);
    host.append(box);   /* one slot per pane: append, never innerHTML */
    open.push({ id: ids[j], box: box, log: log, sig: null, pinned: true });
    (function (s) {
      s.log.addEventListener('scroll', function () {
        var l = s.log;
        s.pinned = l.scrollTop + l.clientHeight >= l.scrollHeight - 32;
      });
      s.box.addEventListener('click', function () { setFocus(s.id); });
    })(open[open.length - 1]);
  }
  setFocus(id);
  sendWatch();
}

/* a pane that exited on the desktop takes only its own slot; whatever else
   the phone was mirroring keeps running */
function dropPane(id) {
  var s = slot(id);
  if (!s) return;
  s.box.remove();
  var i = open.indexOf(s);
  if (i >= 0) open.splice(i, 1);
  if (focus === id) focus = null;
  if (!open.length) { closeViewer(); return; }
  setFocus(focus || open[0].id);
}

function closeViewer() {
  /* no paneId: the server releases every watch this socket holds */
  if (open.length) send({ t: 'unwatch' });
  open = [];
  focus = null;
  $('panes').textContent = '';
  $('viewer').hidden = true;
}

$('back').addEventListener('click', closeViewer);

/* typing: field + quick keys */
(function () {
  var field = $('tinput');
  var sendBtn = $('tsend');

  sendBtn.addEventListener('click', function () {
    if (field.value) {
      sendInput(field.value + '\r');
      field.value = '';
    }
    field.focus();
  });
  field.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendInput(field.value + '\r');
      field.value = '';
    }
  });
  var keys = document.querySelectorAll('.tkeys button[data-seq]');
  for (var i = 0; i < keys.length; i++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        var seq = btn.getAttribute('data-seq');
        try { seq = JSON.parse(seq); } catch (e) {}
        sendInput(seq);
      });
    })(keys[i]);
  }
})();

connect();
</script>
</body>
</html>
