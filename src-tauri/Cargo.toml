[package]
name = "bentomux"
version = "0.2.4"
edition = "2021"
description = "Bentomux — calm desktop for AI agent runtime workspaces"
license = "MIT"
repository = "https://github.com/takora-dev/bentomux-v2"

[lib]
name = "bentomux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` powers the system-tray icon the app hides behind when the
# window is closed (see tray.rs); the crate is already in the lockfile as
# tauri's optional dependency, so this only turns the feature on.
tauri = { version = "2.1", features = ["macos-private-api", "tray-icon", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["net", "sync", "rt", "rt-multi-thread", "macros", "time", "io-util", "io-std"] }
portable-pty = "0.8"
sysinfo = "0.32"
notify = "7.0"
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
qrcode = { version = "0.14", features = ["svg"] }
local-ip-address = "0.6"
base64 = "0.22"
rand = "0.8"
chrono = "0.4"
dirs = "5.0"
# native folder picker for workspace_choose (no Tauri plugin/capability needed;
# rfd opens its own OS dialog out-of-process)
rfd = "0.15"

# Screen buffer parsing (pure-Rust option for agent state detection)
vt100 = "0.15"

# YAML/TOML parsing for agent configs
serde_yaml = "0.9"
toml = "0.8"
# manifest rule matching (screen/line regexes)
regex = "1"
# cloudflared ships gzipped in the bundle and is inflated into the app cache on
# first tunnel use (39.8 MB -> 20.3 MB on darwin-x86_64); already in the tree via
# tauri-plugin-updater's zip feature, so this adds no new crates
flate2 = "1"
# plugin install: zip/tar for archives, sha2 for the pinned digest,
# reqwest for HTTPS installs. All already in the tree via
# tauri-plugin-updater, so these add no new crates.
zip = "4"
sha2 = "0.10"
semver = "1"
# no `http2`: it pulls h2/quinn, which the existing lockfile does not carry.
# Plugin downloads are single small zips; HTTP/1.1 is the right transport and
# adding h2 would mean a lockfile-wide dependency bump for no benefit.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# one daemon and one bentomux.json per machine: a second launch focuses the
# window the user already has instead of racing it for both
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
# Unix socket support included in tokio

[profile.dev]
debug = 1
incremental = true

[profile.release]
codegen-units = 1
lto = true
# speed profile: the previous "s" (size) setting cost throughput on the hot
# paths (vt100 screen parsing, pty chunk decode, sysinfo walks) for a bundle
# that is a rounding error next to the webview it ships with
opt-level = 3
strip = true
